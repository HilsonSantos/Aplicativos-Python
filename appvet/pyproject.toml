[tool.poetry]
name = "appvet"
version = "0.1.0"
description = "Sistema de gestão para clínica veterinária"
authors = ["Equipe APPVET"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.35"
pydantic = "^2.9.0"
streamlit = "^1.39.0"
requests = "^2.32.3"
python-multipart = "^0.0.12"

[tool.poetry.group.dev.dependencies]
ruff = "^0.7.0"
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["streamlit_app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["appvet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
